global:
    scrape_interval: 15s
    evaluation_interval: 15s
scrape_configs:
    - job_name: 'prometheus'
      static_configs:
          - targets: ['localhost:9090']
    - job_name: 'ticket-api'
      static_configs:
          - targets: ['api:8000']
rule_files:
    - '/etc/prometheus/alerts.yml'