# Local stand-in for CloudFront (docker-compose.yml, service "web"; never deployed).
# Serves frontend/ and forwards the API paths to the api container, so the page and
# the API share one origin exactly as in production: http://localhost:8080
#
# Mirrors, and must stay in step with:
#   - infra/edge.js.tftpl   which paths reach the API; everything else is 404
#   - infra/cdn.tf          60 s origin timeout, CloudFront-Viewer-Address
#   - the page's CSP        sent only with the page, never with the API's /docs
# tests/test_nginx_local.py checks the path list against edge.js.tftpl.

server {
    listen 80;
    server_name _;
    server_tokens off;  # no nginx version in error pages and headers

    # same value CloudFront allows for the agent's slowest tickets
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    # the request body limit (the API rejects more than 30,000 characters anyway)
    client_max_body_size 256k;

    # --- API paths: the edge function's allow-list --------------------------------
    # /docs/ also covers Swagger's /docs/oauth2-redirect.
    location ~ ^/(tickets|health|docs)(/.*)?$ {
        proxy_pass http://api:8000;
        include /etc/nginx/api_proxy.conf;
    }
    location = /openapi.json {
        proxy_pass http://api:8000;
        include /etc/nginx/api_proxy.conf;
    }

    # never reaches the API from outside, same 404 text as the edge function
    location ~ ^/metrics(/.*)?$ {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 404 "Not found. The API is described at /docs.\n";
    }

    # --- the page (S3 in production) -----------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;

        # Security headers for the page only. Not on the API paths above: Swagger UI at
        # /docs loads its scripts from a CDN and would break under this policy.
        # frame-ancestors (no embedding in other sites) works only as a header.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # edits to app.js show on reload, with no stale copy in the browser
        add_header Cache-Control "no-cache" always;
    }
}
