# Request headers for the API paths in nginx.local.conf, as CloudFront would send them.
proxy_http_version 1.1;
proxy_set_header Host $host;
# what CloudFront adds and the rate limit keys on (api/main.py, client_ip). Set here,
# so a value the browser sends is overwritten, as CloudFront does.
proxy_set_header CloudFront-Viewer-Address "$remote_addr:$remote_port";
# not forwarded by CloudFront's origin request policy either
proxy_set_header X-Forwarded-For "";
proxy_set_header Cookie "";
