services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"  # REST, bound to localhost only
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    restart: unless-stopped

  api:
    build: .  # the repository root
    ports:
      - "127.0.0.1:8000:8000"  # localhost only until there is a proxy in front of it
    environment:
      QDRANT_URL: http://qdrant:6333  # the service name; "localhost" inside a container is the container
      # read from the shell that runs compose, never stored in the image; fails fast if unset
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in the shell before docker compose up}
    volumes:
      - ./data/handoff:/app/data/handoff  # the hand-off queue outlives the container
    depends_on:
      - qdrant  # starts first; the API retries via restart if Qdrant is not ready yet
    restart: unless-stopped

  # Local stand-in for CloudFront: the page (frontend/) and the API on one origin,
  # http://localhost:8080. Production serves the page from S3 through CloudFront, so
  # docker-compose.prod.yml switches this service off.
  web:
    image: nginx:1.30-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx.api_proxy.conf:/etc/nginx/api_proxy.conf:ro
    depends_on: [api]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [api]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana/provisioning/dashboards/provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./monitoring/grafana/dashboards/ticket-agent.json:/etc/grafana/dashboards/ticket-agent.json:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set it in the shell}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data: