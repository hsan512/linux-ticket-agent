name: CI
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                python-version: '3.12'
                cache: 'pip'
            - name: Install dependencies
              run: pip install -r requirements.txt
            - name: Run tests
              run: python -m pytest -q
    docker:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Build Docker image
              run: docker build .
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                python-version: '3.12'
            - name: Install ruff
              run: pip install ruff==0.17.4
            - name: Lint
              run: ruff check .
            - name: Check formatting
              run: ruff format --check .
    monitoring:
        runs-on: ubuntu-latest
        env:
            # same image and same /etc/prometheus path as docker-compose.yml, so the
            # absolute rule_files path in prometheus.yml resolves here too
            PROMTOOL: >-
                docker run --rm --user 0 --entrypoint promtool
                -v ${{ github.workspace }}/monitoring/prometheus:/etc/prometheus:ro
                -w /etc/prometheus prom/prometheus:v3.16.0
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Check Prometheus config
              run: $PROMTOOL check config prometheus.yml
            - name: Check alert rules
              run: $PROMTOOL check rules alerts.yml
            - name: Test alert rules
              run: $PROMTOOL test rules alerts_test.yml

permissions:
    contents: read