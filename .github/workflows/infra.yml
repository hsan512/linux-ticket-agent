name: Infra
# Starts and stops the demo's EC2 instance with Terraform (infra/). Only the instance
# comes and goes; CloudFront, S3, SSM and IAM stay, and while it is down the URL
# answers 503 "offline".
#   up:   terraform apply instance_enabled=true, then wait until /health answers
#         through CloudFront (the boot script installs Docker and runs deploy.sh)
#   down: back up the hand-off queue to S3, then terraform apply instance_enabled=false
# Started by hand (Actions tab or `gh workflow run infra.yml -f action=up`). A daily
# scheduled down is a safety net against a forgotten instance; when the demo is
# already down it changes nothing.
on:
    workflow_dispatch:
        inputs:
            action:
                description: up starts the demo, down stops it
                type: choice
                options: [up, down]
                required: true
            skip_backup:
                description: "down only: skip the hand-off backup (broken instance)"
                type: boolean
                default: false
    schedule:
        - cron: "0 17 * * *"  # 17:00 UTC daily; runs the down job only
concurrency:  # up and down never overlap; Terraform's S3 lock also guards local runs
    group: infra
    cancel-in-progress: false
permissions:
    contents: read
    id-token: write  # both jobs log in to AWS with OIDC (role gh-infra)
defaults:
    run:
        working-directory: infra
jobs:
    up:
        # event_name too: a scheduled run must never start the instance
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'up'
        runs-on: ubuntu-latest
        environment: infra  # gh-infra trusts only this environment (infra/iam.tf)
        steps:
            - uses: actions/checkout@v7
            - uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ vars.INFRA_ROLE_ARN }}
                  aws-region: us-east-1  # the region in infra/variables.tf
            - uses: hashicorp/setup-terraform@v4
              with:
                  terraform_version: 1.17.2
                  terraform_wrapper: false  # the wrapper adds text to `terraform output`
            - run: terraform init -input=false
            - run: terraform apply -input=false -auto-approve -var instance_enabled=true
            - name: Read the URL
              id: url
              run: echo "url=$(terraform output -raw url)" >> "$GITHUB_OUTPUT"
            - name: Wait until healthy
              # /health, not the page: the page comes from S3 and answers 200 even
              # while the instance is still booting. The first boot installs Docker,
              # downloads the 1.6 GB index and pulls the image, hence 15 minutes.
              run: |
                  URL="${{ steps.url.outputs.url }}"
                  for i in $(seq 60); do
                      echo "Attempt $i: $URL/health"
                      if curl -fsS "$URL/health"; then
                          echo
                          echo "Healthy."
                          exit 0
                      fi
                      sleep 15
                  done
                  echo "Not healthy after 15 minutes."
                  exit 1
            - name: Print the boot log
              if: failure()
              # The instance is left running for debugging; run down when done.
              run: |
                  INSTANCE_ID="$(aws ec2 describe-instances \
                      --filters Name=tag:App,Values=ticket-agent Name=instance-state-name,Values=running \
                      --query 'Reservations[].Instances[].InstanceId' --output text)"
                  if [[ -z "$INSTANCE_ID" ]]; then
                      echo "No running instance: the failure happened before it started."
                      exit 0
                  fi
                  echo "Boot log of $INSTANCE_ID:"
                  COMMAND_ID="$(aws ssm send-command \
                      --instance-ids "$INSTANCE_ID" \
                      --document-name AWS-RunShellScript \
                      --parameters '{"commands":["tail -n 100 /var/log/cloud-init-output.log"]}' \
                      --query Command.CommandId --output text)"
                  aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
                  aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                      --query StandardOutputContent --output text
                  echo "The instance is still running: run the down action when done." >> "$GITHUB_STEP_SUMMARY"
            - name: Summary
              run: |
                  {
                      echo "## The demo is up"
                      echo
                      echo "URL: ${{ steps.url.outputs.url }}"
                      echo
                      echo "Remember to run the down action (or wait for the 17:00 UTC one)."
                  } >> "$GITHUB_STEP_SUMMARY"
    down:
        # a scheduled run has no inputs, so the schedule is checked first
        if: github.event_name == 'schedule' || inputs.action == 'down'
        runs-on: ubuntu-latest
        environment: infra
        steps:
            - uses: actions/checkout@v7
            - uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ vars.INFRA_ROLE_ARN }}
                  aws-region: us-east-1
            - uses: hashicorp/setup-terraform@v4
              with:
                  terraform_version: 1.17.2
                  terraform_wrapper: false
            - run: terraform init -input=false
            - name: Find the running instance
              id: instance
              # the App tag: never touch another instance in the account
              run: |
                  INSTANCE_ID="$(aws ec2 describe-instances \
                      --filters Name=tag:App,Values=ticket-agent Name=instance-state-name,Values=running \
                      --query 'Reservations[].Instances[].InstanceId' --output text)"
                  echo "id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
            - name: Back up the hand-off queue
              # Escalated tickets are real user data: if this fails, the job stops
              # before Terraform destroys the instance. skip_backup is empty on a
              # schedule, so the backup runs.
              if: steps.instance.outputs.id != '' && !inputs.skip_backup
              run: |
                  INSTANCE_ID="${{ steps.instance.outputs.id }}"
                  echo "Backing up the hand-off queue on $INSTANCE_ID"
                  # no --delete: S3 keeps everything (the bucket is versioned too)
                  COMMAND_ID="$(aws ssm send-command \
                      --instance-ids "$INSTANCE_ID" \
                      --document-name AWS-RunShellScript \
                      --parameters '{"commands":["aws s3 sync /opt/ticket-agent/data/handoff/ s3://${{ vars.DATA_BUCKET }}/handoff/ --only-show-errors"]}' \
                      --query Command.CommandId --output text)"
                  # fails (and so fails the job) if the command failed
                  aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
                  echo "Backup done."
            - run: terraform apply -input=false -auto-approve -var instance_enabled=false
